# Based on ExampleMod1.7.10 bd8e4160b677466de3cfff2c4011a3806fa74942.
# Disable automatic build rewriting; convention settings pinned to template tag.
gtnh.settings.blowdryerTag = 0.2.2
modName = Diorama
modId = diorama
modGroup = dev.diorama
useModGroupForPublishing = true
autoUpdateBuildScript = false
gtnh.modules.gitVersion = false
minecraftVersion = 1.7.10
forgeVersion = 10.13.4.1614
channel = stable
mappingsVersion = 12
remoteMappings = https\://raw.githubusercontent.com/MinecraftForge/FML/1.7.10/conf/
developmentEnvironmentUserName = DioramaDev
enableModernJavaSyntax = jvmDowngrader
downgradeTargetVersion = 8
# Deliberate initial MR experiment: base8 plus native21/25; not yet loader-tested.
jvmDowngraderMultiReleaseVersions = 21,25
jvmDowngraderStubsProvider = gtnhlib
enableGenericInjection = true
generateGradleTokenClass =
usesMixins = false
forceEnableMixins = false
containsMixinsAndOrCoreModOnly = false
usesShadowedDependencies = false
includeWellKnownRepositories = false
usesMavenPublishing = false
curseForgeEnvironments = client
org.gradle.jvmargs = -Xmx3G -Dfile.encoding=UTF-8
