name: GTNH build
on:
  push:
    branches: [ci/gtnh-world-persistence]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Format preview and report exact patch
        working-directory: versions/1.7.10-forge
        run: |
          bash gradlew spotlessApply
          git diff --no-ext-diff | tee "$RUNNER_TEMP/format.patch"
      - name: Build and verify
        working-directory: versions/1.7.10-forge
        run: bash gradlew assemble verifyBaseline --continue
      - name: List JAR bytecode products on failure
        if: failure()
        working-directory: versions/1.7.10-forge
        run: |
          for jar in build/libs/*.jar; do
            if [ -f "$jar" ]; then
              echo "$jar"
              unzip -Z1 "$jar" | grep '^META-INF/versions/' || true
            fi
          done
      - name: Save formatter patch on failure
        if: failure()
        working-directory: versions/1.7.10-forge
        run: |
          bash gradlew spotlessApply
          git diff --no-ext-diff | tee "$RUNNER_TEMP/format.patch"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: format-patch
          path: ${{ runner.temp }}/format.patch
      - uses: actions/upload-artifact@v4
        with:
          name: diorama-gtnh
          path: |
            versions/1.7.10-forge/build/libs/*.jar
            !versions/1.7.10-forge/build/libs/*-dev.jar
            !versions/1.7.10-forge/build/libs/*-sources.jar
            !versions/1.7.10-forge/build/libs/*probe*.jar
            !versions/1.7.10-forge/build/libs/*predowngrade*.jar
