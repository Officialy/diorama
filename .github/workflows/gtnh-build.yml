name: GTNH build
on:
  push:
    branches: [ci/gtnh-appearance-v2]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Build and verify
        working-directory: versions/1.7.10-forge
        run: bash gradlew assemble verifyBaseline
      - uses: actions/upload-artifact@v4
        with:
          name: diorama-gtnh
          path: |
            versions/1.7.10-forge/build/libs/*.jar
            !versions/1.7.10-forge/build/libs/*-dev.jar
            !versions/1.7.10-forge/build/libs/*-sources.jar
            !versions/1.7.10-forge/build/libs/*probe*.jar
            !versions/1.7.10-forge/build/libs/*predowngrade*.jar
